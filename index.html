<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavy Digital | Web Design Studio</title>
    <meta name="description" content="Wavy Digital builds fast, professional websites that get your business more customers. Once-off fee. 5-day delivery.">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --black: #080808;
            --white: #f5f2ee;
            --accent: #c8f55a;
            --accent-dark: #a8d93a;
            --mid: #1a1a1a;
            --muted: #888;
            --border: rgba(255,255,255,0.08);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background: #080808;
            color: #f5f2ee;
            font-family: 'DM Sans', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            overflow-x: hidden;
            width: 100%;
        }

        /* FLOATING WA */
        .wa-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            background: #c8f55a;
            color: #080808;
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 14px 22px;
            border-radius: 100px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 24px rgba(200,245,90,0.4);
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: rgba(8,8,8,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .nav-logo {
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: #f5f2ee;
            text-decoration: none;
        }
        .nav-logo span {
            color: #c8f55a;
        }
        .nav-cta {
            background: #c8f55a;
            color: #080808;
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 10px 22px;
            border-radius: 100px;
            text-decoration: none;
            white-space: nowrap;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 120px 20px 72px;
            background: #080808;
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 80% 20%, rgba(200,245,90,0.12) 0%, transparent 60%);
        }
        .hero-tag {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c8f55a;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }
        .hero h1 {
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 800;
            font-size: clamp(2.4rem, 7vw, 7rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }
        .hero h1 em {
            font-style: normal;
            color: #c8f55a;
            display: block;
        }
        .hero-sub {
            max-width: 480px;
            color: rgba(245,242,238,0.65);
            font-size: 1rem;
            line-height: 1.75;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .hero-sub strong {
            color: #f5f2ee;
        }
        .hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .btn-primary {
            background: #c8f55a;
            color: #080808;
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 16px 28px;
            border-radius: 100px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-ghost {
            color: #f5f2ee;
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            opacity: 0.6;
        }

        /* STATS */
        .stats {
            background: #1a1a1a;
            padding: 32px 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .stat {
            text-align: center;
            flex: 1 1 140px;
        }
        .stat-num {
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 800;
            font-size: 1.7rem;
            color: #c8f55a;
            line-height: 1;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 0.72rem;
            color: #888;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* MARQUEE */
        .marquee-wrap {
            overflow: hidden;
            padding: 14px 0;
            background: #c8f55a;
        }
        .marquee-track {
            display: flex;
            animation: marquee 22s linear infinite;
            white-space: nowrap;
        }
        .marquee-item {
            font-family: 'Syne', Arial, sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(8,8,8,0.65);
            padding: 0 28px;
            flex-shrink: 0;
        }
        .marquee-item span {
            color: #080808;
            margin-right: 28px;
        }
        @keyframes marquee {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* SECTIONS */
        section {
            padding: 80px 20px;
        }
        .label {
            font-size: 0.67rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #c8f55a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .label::after {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: #c8f55a;
        }
        h2 {
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 800;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            letter-spacing: -0.02em;
            line-height: 1.08;
            margin-bottom: 20px;
        }
        .section-sub {
            color: rgba(245,242,238,0.5);
            font-size: 0.93rem;
            line-height: 1.75;
            max-width: 400px;
            margin-bottom: 48px;
        }

        /* WHY */
        .why {
            background: #1a1a1a;
        }
        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2px;
            margin-bottom: 48px;
        }
        .why-card {
            background: #080808;
            padding: 40px 24px;
        }
        .why-icon {
            font-size: 2rem;
            margin-bottom: 16px;
            display: block;
        }
        .why-card h3 {
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .why-card p {
            color: rgba(245,242,238,0.5);
            font-size: 0.87rem;
            line-height: 1.75;
        }
        .section-cta {
            text-align: center;
        }

        /* SERVICES */
        .services {
            background: #080808;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2px;
            margin-bottom: 48px;
        }
        .service-card {
            background: #1a1a1a;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
        }
        .service-num {
            font-size: 0.67rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #c8f55a;
            margin-bottom: 20px;
            font-family: 'Syne', Arial, sans-serif;
        }
        .service-icon {
            font-size: 2rem;
            margin-bottom: 14px;
            display: block;
        }
        .service-card h3 {
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .service-card p {
            color: rgba(245,242,238,0.5);
            font-size: 0.87rem;
            line-height: 1.75;
            margin-bottom: 20px;
            flex: 1;
        }
        .service-btn {

display: inline-flex;
align-items: center;
gap: 6px;
background: #c8f55a;
color: #080808;
font-family: 'Syne', Arial, sans-serif;
font-weight: 700;
font-size: 0.76rem;
padding: 10px 16px;
border-radius: 100px;
text-decoration: none;
width: fit-content;
}
/* WORK */
.work {
background: #1a1a1a;
}
.work-featured {
background: #080808;
border-radius: 14px;
overflow: hidden;
display: grid;
grid-template-columns: 1fr;
margin-bottom: 24px;
}
.work-img {
position: relative;
overflow: hidden;
min-height: 260px;
}
.work-img img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.work-info {
padding: 32px 24px;
display: flex;
flex-direction: column;
justify-content: center;
}
.work-badge {
display: inline-flex;
background: rgba(200,245,90,0.1);
border: 1px solid rgba(200,245,90,0.2);
color: #c8f55a;
font-size: 0.67rem;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
padding: 6px 12px;
border-radius: 100px;
margin-bottom: 20px;
width: fit-content;
}
.work-name {
font-family: 'Syne', Arial, sans-serif;
font-weight: 800;
font-size: clamp(1.4rem, 3vw, 2rem);
letter-spacing: -0.02em;
margin-bottom: 12px;
line-height: 1.1;
}
.work-desc {
color: rgba(245,242,238,0.55);
font-size: 0.92rem;
line-height: 1.75;
margin-bottom: 28px;
}
.work-btns {
display: flex;
gap: 12px;
flex-wrap: wrap;
align-items: center;
}
.work-link {
color: #c8f55a;
font-family: 'Syne', Arial, sans-serif;
font-weight: 700;
font-size: 0.82rem;
text-decoration: none;
letter-spacing: 0.04em;
}
.work-btn {
background: #c8f55a;
color: #080808;
font-family: 'Syne', Arial, sans-serif;
font-weight: 700;
font-size: 0.76rem;
padding: 10px 16px;
border-radius: 100px;
text-decoration: none;
}
.work-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 16px;
}
.grid-card {
background: #080808;
border-radius: 12px;
overflow: hidden;
display: flex;
flex-direction: column;
}
.grid-thumb {
height: 190px;
overflow: hidden;
}
.grid-thumb img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.grid-body {
padding: 24px;
flex: 1;
display: flex;
flex-direction: column;
}
.grid-tag {
display: inline-flex;
background: rgba(200,245,90,0.08);
border: 1px solid rgba(200,245,90,0.15);
color: #c8f55a;
font-size: 0.62rem;
font-weight: 700;
letter-spacing: 0.12em;
text-transform: uppercase;
padding: 4px 10px;
border-radius: 100px;
margin-bottom: 10px;
width: fit-content;
}
.grid-name {
font-family: 'Syne', Arial, sans-serif;
font-weight: 700;
font-size: 1.05rem;
margin-bottom: 8px;
}
/* RESPONSIVE BREAKPOINT FOR DESKTOP SCREENS */
@media (min-width: 768px) {
nav { padding: 18px 40px; }
.hero { padding: 100px 40px 72px; }
.stats { padding: 32px 40px; }
section { padding: 96px 40px; }
.why-card { padding: 40px 32px; }
.service-card { padding: 40px 32px; }
.work-featured { grid-template-columns: 1fr 1fr; }
.work-info { padding: 48px 40px; }
}
